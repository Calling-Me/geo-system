services:
  - type: web
    name: geo-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: geo-db
          property: connectionString
      - key: TAVILY_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
