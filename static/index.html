<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO System | AI 时代的流量主宰</title>
    <!-- 使用 unpkg 作为更稳定的 CDN 源 (支持跨国加速) -->
    <script src="https://unpkg.com/tailwindcss-jit-cdn"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">

    <!-- Header -->
    <header class="w-full max-w-6xl flex justify-between items-center mb-12">
        <div class="text-3xl font-bold tracking-tighter text-sky-400 neon-text">GEO SYSTEM</div>
        <div class="flex gap-4 text-sm text-slate-400 items-center">
            <span id="systemStatus" class="px-3 py-1 rounded-full bg-slate-800 border border-slate-700 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                Mode: Simulation
            </span>
            <button onclick="upgradePro()" class="bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-bold px-4 py-1 rounded-full hover:scale-105 transition shadow-lg shadow-orange-500/20">
                🚀 Upgrade Pro
            </button>
        </div>
    </header>

    <!-- Main Input Section -->
    <main class="w-full max-w-4xl space-y-8">
        <div class="text-center space-y-4">
            <h1 class="text-5xl font-extrabold text-white">AI 知道你的品牌吗？</h1>
            <p class="text-xl text-slate-400">输入品牌名称，一键生成全网大模型 (LLM) 存在感审计报告。</p>
        </div>

        <div class="glass p-8 rounded-2xl shadow-2xl flex gap-4">
            <input id="brandInput" type="text" placeholder="输入品牌名称 (例如: 蔚来汽车, 瑞幸咖啡...)" 
                   class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-6 py-4 text-lg text-white focus:outline-none focus:border-sky-500 transition">
            <button onclick="runAudit()" 
                    class="bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 px-8 rounded-lg text-lg transition shadow-[0_0_20px_rgba(14,165,233,0.5)]">
                开始审计
            </button>
        </div>

        <!-- Results Section (Hidden initially) -->
        <div id="resultsArea" class="hidden space-y-6">
            <!-- Score Card -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass p-6 rounded-xl text-center">
                    <div class="text-slate-400 mb-2">GEO 总分</div>
                    <div id="scoreValue" class="text-6xl font-black text-sky-400">0</div>
                </div>
                <div class="glass p-6 rounded-xl text-center">
                    <div class="text-slate-400 mb-2">市场评级</div>
                    <div id="marketGrade" class="text-2xl font-bold text-white mt-4">-</div>
                </div>
                <div class="glass p-6 rounded-xl text-center">
                    <div class="text-slate-400 mb-2">AI 情感倾向</div>
                    <div class="text-2xl font-bold text-green-400 mt-4">Positive</div>
                </div>
            </div>

            <!-- Chart -->
            <div class="glass p-6 rounded-xl">
                <canvas id="geoChart"></canvas>
            </div>

            <!-- Suggestions -->
            <div class="glass p-6 rounded-xl border-l-4 border-yellow-500">
                <h3 class="text-xl font-bold text-white mb-4">优化建议 (VIP)</h3>
                <ul id="suggestionList" class="space-y-2 text-slate-300 list-disc pl-5">
                </ul>
            </div>
        </div>

        <!-- History Section -->
        <div class="mt-12">
            <h2 class="text-2xl font-bold text-white mb-6">🔍 最近审计记录 (Live History)</h2>
            <div class="glass rounded-xl overflow-hidden">
                <table class="w-full text-left text-slate-300">
                    <thead class="bg-slate-800 text-slate-400 uppercase text-sm">
                        <tr>
                            <th class="px-6 py-4">品牌</th>
                            <th class="px-6 py-4">得分</th>
                            <th class="px-6 py-4">时间</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable" class="divide-y divide-slate-700">
                        <!-- History rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Load history on start
        window.onload = loadHistory;

        async function upgradePro() {
            const btn = document.querySelector('button[onclick="upgradePro()"]');
            btn.innerText = "Connecting Stripe...";
            
            try {
                const res = await fetch('/api/create-checkout-session', { method: 'POST' });
                const data = await res.json();
                
                if (res.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert("支付系统暂未配置 (Missing API Key)。\n请在 Render 后台添加 STRIPE_API_KEY 环境变量。");
                }
            } catch (e) {
                alert("支付跳转失败，请稍后重试。");
            } finally {
                btn.innerText = "🚀 Upgrade Pro";
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const logs = await res.json();
                const tbody = document.getElementById('historyTable');
                tbody.innerHTML = logs.map(log => `
                    <tr class="hover:bg-slate-800/50 transition">
                        <td class="px-6 py-4 font-medium text-white">${log.brand_name}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded text-xs font-bold ${log.geo_score >= 80 ? 'bg-green-500/20 text-green-400' : 'bg-yellow-500/20 text-yellow-400'}">
                                ${log.geo_score}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-slate-500 text-sm">${new Date(log.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        async function runAudit() {
            const brand = document.getElementById('brandInput').value;
            if (!brand) return alert("请输入品牌名称！");

            // UI Loading state
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "🚀 AI 正在全网扫描...";
            btn.disabled = true;

            try {
                const response = await fetch(`/api/analyze?brand=${brand}`);
                const data = await response.json();
                
                renderReport(data);
                loadHistory(); // Refresh history
            } catch (e) {
                alert("系统连接失败，请确保后端已启动。");
                console.error(e);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function renderReport(data) {
            document.getElementById('resultsArea').classList.remove('hidden');
            
            // Update Status Badge based on backend response
            const statusEl = document.getElementById('systemStatus');
            if (data.data_source.includes("Real")) {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.8)]"></span> Mode: Real-Time (Active)`;
                statusEl.className = "px-3 py-1 rounded-full bg-green-900/30 border border-green-500/50 text-green-400 flex items-center gap-2 transition-all duration-500";
            } else {
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span> Mode: Simulation`;
                statusEl.className = "px-3 py-1 rounded-full bg-yellow-900/30 border border-yellow-500/50 text-yellow-400 flex items-center gap-2 transition-all duration-500";
            }

            // Update Text
            document.getElementById('scoreValue').innerText = data.geo_score;
            document.getElementById('marketGrade').innerText = data.market_grade;
            
            // Update List
            const list = document.getElementById('suggestionList');
            list.innerHTML = "";
            data.suggestions.forEach(s => {
                const li = document.createElement('li');
                li.innerText = s;
                list.appendChild(li);
            });

            // Update Chart
            const ctx = document.getElementById('geoChart').getContext('2d');
            
            // Destroy old chart if exists
            if (window.myChart) window.myChart.destroy();

            const labels = Object.keys(data.model_breakdown);
            const scores = labels.map(k => data.model_breakdown[k].visibility_score);

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'AI 提及可见度 (Visibility Score)',
                        data: scores,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: 'rgba(56, 189, 248, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    },
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });
        }
    </script>
    <footer class="w-full max-w-6xl mt-12 mb-8 text-center text-slate-600 text-sm">
        <p>&copy; 2025 GEO System Inc. | v2.2 (Global CDN Fix)</p>
    </footer>
</body>
</html>
