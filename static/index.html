<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO System | AI 时代的流量主宰</title>
    <!-- 使用 Chart.js (Staticfile CDN for China) -->
    <script src="https://cdn.staticfile.org/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        /* Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0f172a; 
            color: #e2e8f0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Utility Classes (Manual Tailwind) */
        .w-full { width: 100%; }
        .max-w-6xl { max-width: 72rem; }
        .max-w-4xl { max-width: 56rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .mb-12 { margin-bottom: 3rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-12 { margin-top: 3rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .text-center { text-align: center; }
        .hidden { display: none; }
        .space-y-8 > * + * { margin-top: 2rem; }
        .space-y-4 > * + * { margin-top: 1rem; }
        
        /* Typography */
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-sm { font-size: 0.875rem; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .font-bold { font-weight: 700; }
        .font-extrabold { font-weight: 800; }
        .text-white { color: #fff; }
        .text-slate-400 { color: #94a3b8; }
        .text-sky-400 { color: #38bdf8; }
        .text-green-400 { color: #4ade80; }
        .text-yellow-400 { color: #facc15; }
        .text-slate-300 { color: #cbd5e1; }
        .text-slate-500 { color: #64748b; }
        .text-slate-600 { color: #475569; }

        /* Components */
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1rem;
        }
        
        .neon-text { 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); 
        }

        .btn-primary {
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 0 20px rgba(14,165,233,0.5);
        }
        .btn-primary:hover { background-color: #0ea5e9; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        .btn-pro {
            background: linear-gradient(to right, #facc15, #f97316);
            color: black;
            font-weight: bold;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.3);
            transition: transform 0.2s;
        }
        .btn-pro:hover { transform: scale(1.05); }

        .input-field {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            font-size: 1.125rem;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-field:focus { border-color: #38bdf8; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background-color: #1e293b;
            border: 1px solid #334155;
            font-size: 0.875rem;
        }
        .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.5rem; }
        .dot.yellow { background-color: #facc15; }
        .dot.green { background-color: #4ade80; box-shadow: 0 0 10px #4ade80; }

        /* Grid */
        .grid { display: grid; }
        @media (min-width: 768px) {
            .md\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background-color: #1e293b; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        tr:hover { background-color: rgba(30, 41, 59, 0.5); }
        td, th { padding: 1rem 1.5rem; border-bottom: 1px solid #334155; }
        
        .tag { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; }
        .tag-high { background-color: rgba(74, 222, 128, 0.2); color: #4ade80; }
        .tag-low { background-color: rgba(250, 204, 21, 0.2); color: #facc15; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="w-full max-w-6xl flex justify-between items-center mb-12">
        <div class="text-3xl font-bold neon-text text-sky-400">GEO SYSTEM</div>
        <div class="flex gap-4 text-sm text-slate-400 items-center">
            <span id="systemStatus" class="badge">
                <span class="dot yellow"></span>
                Mode: Simulation
            </span>
            <button onclick="upgradePro()" class="btn-pro">
                🚀 Upgrade Pro
            </button>
        </div>
    </header>

    <!-- Main Input Section -->
    <main class="w-full max-w-4xl space-y-8">
        <div class="text-center space-y-4">
            <h1 class="text-5xl font-extrabold text-white">AI 知道你的品牌吗？</h1>
            <p class="text-xl text-slate-400">输入品牌名称，一键生成全网大模型 (LLM) 存在感审计报告。</p>
        </div>

        <div class="glass p-8 flex gap-4">
            <input id="brandInput" type="text" placeholder="输入品牌名称 (例如: 蔚来汽车, 瑞幸咖啡...)" 
                   class="input-field">
            <button onclick="runAudit()" class="btn-primary">
                开始审计
            </button>
        </div>

        <!-- Results Section (Hidden initially) -->
        <div id="resultsArea" class="hidden space-y-6">
            <!-- Score Card -->
            <div class="grid md:grid-cols-3 gap-6">
                <div class="glass p-6 text-center">
                    <div class="text-slate-400 mb-2">GEO 总分</div>
                    <div id="scoreValue" class="text-6xl font-extrabold text-sky-400">0</div>
                </div>
                <div class="glass p-6 text-center">
                    <div class="text-slate-400 mb-2">市场评级</div>
                    <div id="marketGrade" class="text-2xl font-bold text-white mt-4">-</div>
                </div>
                <div class="glass p-6 text-center">
                    <div class="text-slate-400 mb-2">AI 情感倾向</div>
                    <div class="text-2xl font-bold text-green-400 mt-4">Positive</div>
                </div>
            </div>

            <!-- Chart -->
            <div class="glass p-6">
                <canvas id="geoChart"></canvas>
            </div>

            <!-- Suggestions -->
            <div class="glass p-6" style="border-left: 4px solid #eab308;">
                <h3 class="text-xl font-bold text-white mb-4">优化建议 (VIP)</h3>
                <ul id="suggestionList" style="list-style: disc; padding-left: 1.5rem; color: #cbd5e1; line-height: 1.6;">
                </ul>
            </div>
        </div>

        <!-- History Section -->
        <div class="mt-12">
            <h2 class="text-2xl font-bold text-white mb-6">🔍 最近审计记录 (Live History)</h2>
            <div class="glass" style="overflow: hidden;">
                <table>
                    <thead>
                        <tr>
                            <th>品牌</th>
                            <th>得分</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <!-- History rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Load history on start
        window.onload = loadHistory;

        async function upgradePro() {
            const btn = document.querySelector('button[onclick="upgradePro()"]');
            btn.innerText = "Connecting Stripe...";
            
            try {
                const res = await fetch('/api/create-checkout-session', { method: 'POST' });
                const data = await res.json();
                
                if (res.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert("支付系统暂未配置 (Missing API Key)。\n请在 Render 后台添加 STRIPE_API_KEY 环境变量。");
                }
            } catch (e) {
                alert("支付跳转失败，请稍后重试。");
            } finally {
                btn.innerText = "🚀 Upgrade Pro";
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const logs = await res.json();
                const tbody = document.getElementById('historyTable');
                tbody.innerHTML = logs.map(log => `
                    <tr>
                        <td style="color: white; font-weight: 500;">${log.brand_name}</td>
                        <td>
                            <span class="tag ${log.geo_score >= 80 ? 'tag-high' : 'tag-low'}">
                                ${log.geo_score}
                            </span>
                        </td>
                        <td style="color: #64748b; font-size: 0.875rem;">${new Date(log.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        async function runAudit() {
            const brand = document.getElementById('brandInput').value;
            if (!brand) return alert("请输入品牌名称！");

            // UI Loading state
            const btn = document.querySelector('button[onclick="runAudit()"]');
            const originalText = btn.innerText;
            btn.innerText = "🚀 AI 正在全网扫描...";
            btn.disabled = true;

            try {
                const response = await fetch(`/api/analyze?brand=${brand}`);
                const data = await response.json();
                
                renderReport(data);
                loadHistory(); // Refresh history
            } catch (e) {
                alert("系统连接失败，请确保后端已启动。");
                console.error(e);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function renderReport(data) {
            document.getElementById('resultsArea').classList.remove('hidden');
            
            // Update Status Badge based on backend response
            const statusEl = document.getElementById('systemStatus');
            if (data.data_source.includes("Real")) {
                statusEl.innerHTML = `<span class="dot green"></span> Mode: Real-Time (Active)`;
                statusEl.style.borderColor = "#4ade80";
                statusEl.style.color = "#4ade80";
            } else {
                statusEl.innerHTML = `<span class="dot yellow"></span> Mode: Simulation`;
                statusEl.style.borderColor = "#334155";
                statusEl.style.color = "#facc15";
            }

            // Update Text
            document.getElementById('scoreValue').innerText = data.geo_score;
            document.getElementById('marketGrade').innerText = data.market_grade;
            
            // Update List
            const list = document.getElementById('suggestionList');
            list.innerHTML = "";
            data.suggestions.forEach(s => {
                const li = document.createElement('li');
                li.innerText = s;
                list.appendChild(li);
            });

            // Update Chart
            const ctx = document.getElementById('geoChart').getContext('2d');
            
            // Destroy old chart if exists
            if (window.myChart) window.myChart.destroy();

            const labels = Object.keys(data.model_breakdown);
            const scores = labels.map(k => data.model_breakdown[k].visibility_score);

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'AI 提及可见度 (Visibility Score)',
                        data: scores,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: 'rgba(56, 189, 248, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: '#334155' } },
                        x: { grid: { color: '#334155' } }
                    },
                    plugins: {
                        legend: { labels: { color: 'white' } }
                    }
                }
            });
        }
    </script>
    <footer class="w-full max-w-6xl mt-12 mb-8 text-center text-slate-600 text-sm">
        <p>&copy; 2025 GEO System Inc. | v3.0 (Standalone CSS)</p>
    </footer>
</body>
</html>
