<!DOCTYPE html>
<!-- DEPLOYMENT TRIGGER: v4.0.2 FORCE REFRESH -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO 系统 | AI 品牌审计 v4.1 (CN)</title>
    <!-- 使用 Chart.js (Staticfile CDN for China) -->
    <script src="https://cdn.staticfile.org/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #1e1f24;
            --primary-color: #448aff; /* Google Blue-ish */
            --accent-color: #7c4dff;
            --text-primary: #e3e3e3;
            --text-secondary: #a0a0a0;
            --border-color: #2d2f36;
            --success-color: #00c853;
            --warning-color: #ffd600;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Cards */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Typography */
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
        h3 { font-size: 1.25rem; font-weight: 500; margin-bottom: 1rem; }
        p { color: var(--text-secondary); }

        /* Inputs & Buttons */
        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: #2b2d35;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2962ff;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background-color: #5c6bc0;
            cursor: wait;
        }

        .btn-pro {
            background: linear-gradient(135deg, #ffd600 0%, #ff6d00 100%);
            color: #000;
            padding: 8px 16px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pro:hover {
            filter: brightness(1.1);
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.active { background-color: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .status-dot.sim { background-color: var(--warning-color); }

        /* Grid Layouts */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }

        /* Score Display */
        .score-display {
            text-align: center;
        }
        .score-value {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin: 1rem 0;
        }
        .grade-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #2d2f36;
        }
        tr:last-child td { border-bottom: none; }
        
        .score-tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
        }
        .score-high { background-color: rgba(0, 200, 83, 0.15); color: var(--success-color); }
        .score-low { background-color: rgba(255, 214, 0, 0.15); color: var(--warning-color); }

        /* Hidden Utility */
        .hidden { display: none !important; }
        
        /* Suggestions List */
        .suggestion-list {
            list-style: none;
        }
        .suggestion-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        .suggestion-list li::before {
            content: "💡";
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 0.9rem;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">GEO SYSTEM</div>
            <div class="header-controls">
                <div id="systemStatus" class="status-badge">
                    <span class="status-dot sim"></span>
                    <span>模式: 模拟演示</span>
                </div>
                <button onclick="upgradePro()" class="btn btn-pro">
                    <span>⚡ 升级专业版</span>
                </button>
            </div>
        </header>

        <!-- Hero / Search -->
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1>AI 品牌影响力审计</h1>
            <p>实时洞察大语言模型(LLM)眼中的品牌形象。</p>
            
            <div class="input-group" style="max-width: 600px; margin: 2rem auto;">
                <input id="brandInput" type="text" placeholder="输入品牌名称 (例如: 蔚来汽车, 瑞幸咖啡)...">
                <button onclick="runAudit()" class="btn btn-primary">开始审计</button>
            </div>
        </div>

        <!-- Results Area -->
        <div id="resultsArea" class="hidden">
            <!-- Key Metrics -->
            <div class="grid-3">
                <div class="card score-display">
                    <h3>GEO 综合得分</h3>
                    <div id="scoreValue" class="score-value">0</div>
                    <p>品牌可见度指数</p>
                </div>
                <div class="card score-display">
                    <h3>市场评级</h3>
                    <div id="marketGrade" class="grade-value">-</div>
                    <p>行业相对地位</p>
                </div>
                <div class="card score-display">
                    <h3>情感倾向</h3>
                    <div class="grade-value" style="color: var(--success-color);">正面 (Positive)</div>
                    <p>AI 认知态度</p>
                </div>
            </div>

            <div class="grid-3" style="grid-template-columns: 2fr 1fr;">
                <!-- Chart -->
                <div class="card">
                    <h3>大模型覆盖率分析</h3>
                    <div style="height: 300px; width: 100%;">
                        <canvas id="geoChart"></canvas>
                    </div>
                </div>

                <!-- Suggestions -->
                <div class="card" style="border-top: 4px solid var(--warning-color);">
                    <h3>优化策略建议</h3>
                    <ul id="suggestionList" class="suggestion-list">
                        <!-- Items injected here -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- History -->
        <div class="card">
            <h3>最近审计记录</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>品牌</th>
                            <th>GEO 得分</th>
                            <th>时间</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 GEO System Inc. | 企业级 AI 分析平台 | v4.1.0 (CN)
    </footer>

    <script>
        // --- Core Logic Preserved ---
        
        window.onload = loadHistory;

        async function upgradePro() {
            const btn = document.querySelector('.btn-pro');
            const originalContent = btn.innerHTML;
            btn.innerHTML = "<span>连接中...</span>";
            
            try {
                const res = await fetch('/api/create-checkout-session', { method: 'POST' });
                const data = await res.json();
                
                if (res.ok && data.url) {
                    window.location.href = data.url;
                } else {
                    alert("系统提示: 请在 Render 后台配置 STRIPE_API_KEY。");
                }
            } catch (e) {
                alert("连接失败，请稍后重试。");
            } finally {
                btn.innerHTML = originalContent;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const logs = await res.json();
                const tbody = document.getElementById('historyTable');
                tbody.innerHTML = logs.map(log => `
                    <tr>
                        <td style="font-weight: 500; color: white;">${log.brand_name}</td>
                        <td>
                            <span class="score-tag ${log.geo_score >= 80 ? 'score-high' : 'score-low'}">
                                ${log.geo_score}
                            </span>
                        </td>
                        <td style="color: var(--text-secondary);">${new Date(log.created_at).toLocaleString('zh-CN')}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error("Failed to load history", e);
            }
        }

        async function runAudit() {
            const brand = document.getElementById('brandInput').value;
            if (!brand) return alert("请输入品牌名称。");

            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerText;
            btn.innerText = "分析中...";
            btn.disabled = true;

            try {
                const response = await fetch(`/api/analyze?brand=${brand}`);
                const data = await response.json();
                
                renderReport(data);
                loadHistory(); 
            } catch (e) {
                alert("服务器连接失败，请确保后端正在运行。");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function renderReport(data) {
            document.getElementById('resultsArea').classList.remove('hidden');
            
            // Status Update
            const statusEl = document.getElementById('systemStatus');
            if (data.data_source.includes("Real")) {
                statusEl.innerHTML = `<span class="status-dot active"></span><span>模式: 实时分析</span>`;
                statusEl.style.borderColor = "var(--success-color)";
            } else {
                statusEl.innerHTML = `<span class="status-dot sim"></span><span>模式: 模拟演示</span>`;
            }

            // Metrics
            document.getElementById('scoreValue').innerText = data.geo_score;
            document.getElementById('marketGrade').innerText = data.market_grade;
            
            // Suggestions
            const list = document.getElementById('suggestionList');
            list.innerHTML = "";
            data.suggestions.forEach(s => {
                const li = document.createElement('li');
                li.innerText = s;
                list.appendChild(li);
            });

            // Chart
            const ctx = document.getElementById('geoChart').getContext('2d');
            if (window.myChart) window.myChart.destroy();

            const labels = Object.keys(data.model_breakdown);
            const scores = labels.map(k => data.model_breakdown[k].visibility_score);

            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '可见度得分',
                        data: scores,
                        backgroundColor: '#448aff',
                        borderRadius: 4,
                        barThickness: 20
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: 100, 
                            grid: { color: '#2d2f36' },
                            ticks: { color: '#a0a0a0' }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { color: '#a0a0a0' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
